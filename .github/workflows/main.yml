name: Publicar Short en YouTube

on:
  schedule:
    # 22:00 hora Argentina (UTC-3, sin horario de verano) = 01:00 UTC del día siguiente
    - cron: "0 1 * * *"
  workflow_dispatch: {} # permite disparar el workflow a mano desde GitHub para probar

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar el Short
        run: python generate_short.py

      - name: Subir a YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload_youtube.py
